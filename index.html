<!DOCTYPE html>
<html lang="pt-br">
<head>
<style>
  /* Cabeçalho */
  header img {
    width: 200px; /* Logo maior */
    background: transparent;
  }

  /* Hero */
  .hero {
    background-image: url('logo_bg.png');
    background-size: 50%; /* Logo de fundo maior */
    opacity: 0.8; /* Transparência suave */
  }

  /* Seção de Serviços */
  .servicos .descricao {
    border: none; /* Remove o traço */
  }

  /* Nova Seção Alvenaria */
  .alvenaria img {
    max-width: 100%; /* Garante que a imagem se ajuste à tela */
    height: auto;
  }

  /* Contato */
  .contato .horario {
    display: flex; /* Mantém na mesma linha */
    white-space: nowrap;
  }

  /* Card do Leandro */
  .card-leandro .texto-adicional {
    display: none; /* Remove a frase "da fundação ao acabamento..." */
  }
</style>
</head>
<body>

  <header>
    <img src="logo.png" alt="Logo">
  </header>

  <section class="hero">
    <h1>Construindo confiança e entregando excelência</h1>
  </section>

  <section class="servicos">
    <p class="descricao">Descrição dos serviços sem traço abaixo.</p>
  </section>

  <!-- Seção Alvenaria Adicionada -->
  <section class="alvenaria">
    <h2>Alvenaria</h2>
    <img src="IMG-20260820-WA0072.jpg" alt="Foto de obra de alvenaria">
  </section>

  <section class="contato">
    <div class="horario">
      <span>Horário de atendimento: 08:00 - 18:00</span>
    </div>
  </section>

  <section class="card-leandro">
    <img src="leandro.png" alt="Leandro">
    <img src="logo_pequena.png" alt="Logo">
    <p>Construindo confiança e entregando excelência</p>
  </section>

</body>
</html>
